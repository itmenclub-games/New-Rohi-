kind = "web"
previewPath = "/"
title = "Casino Admin Dashboard"
version = "1.0.0"
id = "artifacts/casino-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22742

[services.development]
run = "pnpm --filter @workspace/casino-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/casino-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/casino-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22742"
BASE_PATH = "/"
