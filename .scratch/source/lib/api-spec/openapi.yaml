            type: number
      responses:
        "204":
          description: Deleted

  /bonuses/{id}/toggle:
    patch:
      operationId: toggleBonus
      tags: [bonuses]
      summary: Enable or disable a bonus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated bonus
          content:
            application/json:
