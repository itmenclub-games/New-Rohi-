openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casino Admin Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: conversations
  - name: deposits
  - name: redeems
  - name: game-accounts
  - name: free-play
  - name: games
  - name: payment-methods
  - name: bonuses
  - name: faqs
  - name: telegram-buttons
  - name: settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-messages:
    get:
      operationId: getRecentMessages
      tags: [dashboard]
      summary: Get recent messages across all conversations
      responses:
        "200":
          description: Recent messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentMessage"

  # ─── CONVERSATIONS ────────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, resolved, staff_handling]
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get conversation with messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Not found

  /conversations/{id}/resolve:
    patch:
      operationId: resolveConversation
      tags: [conversations]
      summary: Mark conversation as resolved
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/takeover:
    patch:
      operationId: takeoverConversation
      tags: [conversations]
      summary: Staff takes over conversation from bot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/release:
    patch:
      operationId: releaseConversation
      tags: [conversations]
      summary: Release conversation back to bot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/messages:
    post:
      operationId: sendStaffMessage
      tags: [conversations]
      summary: Staff sends a message in conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ─── DEPOSIT REQUESTS ─────────────────────────────────────────────────────────
  /deposits:
    get:
      operationId: listDeposits
      tags: [deposits]
      summary: List deposit requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, completed]
      responses:
        "200":
          description: List of deposit requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositRequest"

  /deposits/{id}/approve:
    patch:
      operationId: approveDeposit
      tags: [deposits]
      summary: Approve a deposit request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositRequest"

  /deposits/{id}/reject:
    patch:
      operationId: rejectDeposit
      tags: [deposits]
      summary: Reject a deposit request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Updated deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositRequest"

  /deposits/{id}/complete:
    patch:
      operationId: completeDeposit
      tags: [deposits]
      summary: Mark deposit as completed
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositRequest"

  # ─── REDEEM REQUESTS ──────────────────────────────────────────────────────────
  /redeems:
    get:
      operationId: listRedeems
      tags: [redeems]
      summary: List redeem requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, completed]
      responses:
        "200":
          description: List of redeem requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RedeemRequest"

  /redeems/{id}/approve:
    patch:
      operationId: approveRedeem
      tags: [redeems]
      summary: Approve a redeem request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated redeem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemRequest"

  /redeems/{id}/reject:
    patch:
      operationId: rejectRedeem
      tags: [redeems]
      summary: Reject a redeem request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Updated redeem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemRequest"

  /redeems/{id}/complete:
    patch:
      operationId: completeRedeem
      tags: [redeems]
      summary: Mark redeem as completed
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated redeem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemRequest"

  # ─── GAME ACCOUNT REQUESTS ────────────────────────────────────────────────────
  /game-accounts:
    get:
      operationId: listGameAccountRequests
      tags: [game-accounts]
      summary: List game account requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, fulfilled, rejected]
      responses:
        "200":
          description: List of game account requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameAccountRequest"

  /game-accounts/{id}/fulfill:
    patch:
      operationId: fulfillGameAccountRequest
      tags: [game-accounts]
      summary: Fulfill a game account request and send credentials
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameAccountCredentials"
      responses:
        "200":
          description: Fulfilled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameAccountRequest"

  /game-accounts/{id}/reject:
    patch:
      operationId: rejectGameAccountRequest
      tags: [game-accounts]
      summary: Reject a game account request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameAccountRequest"

  # ─── FREE PLAY REQUESTS ───────────────────────────────────────────────────────
  /free-play:
    get:
      operationId: listFreePlayRequests
      tags: [free-play]
      summary: List free play requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of free play requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreePlayRequest"

  /free-play/{id}/approve:
    patch:
      operationId: approveFreePlay
      tags: [free-play]
      summary: Approve free play with amount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreePlayApproval"
      responses:
        "200":
          description: Approved free play request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreePlayRequest"

  /free-play/{id}/reject:
    patch:
      operationId: rejectFreePlay
      tags: [free-play]
      summary: Reject free play request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected free play
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreePlayRequest"

  # ─── GAMES MANAGEMENT ─────────────────────────────────────────────────────────
  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Add a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdate"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /games/{id}/toggle:
    patch:
      operationId: toggleGame
      tags: [games]
      summary: Enable or disable a game
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  # ─── PAYMENT METHODS ──────────────────────────────────────────────────────────
  /payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [payment-methods]
      summary: List all payment methods
      responses:
        "200":
          description: List of payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
    post:
      operationId: createPaymentMethod
      tags: [payment-methods]
      summary: Add a payment method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodInput"
      responses:
        "201":
          description: Created payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /payment-method-requests:
    get:
      operationId: listPaymentMethodRequests
      tags: [payment-methods]
      summary: List customer payment method information requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, sent]
      responses:
        "200":
          description: Payment method information requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethodRequest"

  /payment-methods/{id}:
    patch:
      operationId: updatePaymentMethod
      tags: [payment-methods]
      summary: Update a payment method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodUpdate"
      responses:
        "200":
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
    delete:
      operationId: deletePaymentMethod
      tags: [payment-methods]
      summary: Delete a payment method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /payment-methods/{id}/toggle:
    patch:
      operationId: togglePaymentMethod
      tags: [payment-methods]
      summary: Enable or disable a payment method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /payment-methods/{id}/tags:
    post:
      operationId: addPaymentTag
      tags: [payment-methods]
      summary: Add a tag/account detail to payment method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentTagInput"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentTag"

  /payment-methods/{id}/tags/{tagId}:
    delete:
      operationId: deletePaymentTag
      tags: [payment-methods]
      summary: Delete a payment tag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
        - in: path
          name: tagId
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /payment-methods/{id}/send-tag:
    post:
      operationId: sendPaymentTag
      tags: [payment-methods]
      summary: Send a specific payment tag to a customer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTagInput"
      responses:
        "200":
          description: Tag sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── BONUSES ──────────────────────────────────────────────────────────────────
  /bonuses:
    get:
      operationId: listBonuses
      tags: [bonuses]
      summary: List all bonuses
      responses:
        "200":
          description: List of bonuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bonus"
    post:
      operationId: createBonus
      tags: [bonuses]
      summary: Create a bonus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BonusInput"
      responses:
        "201":
          description: Created bonus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bonus"

  /bonuses/{id}:
    patch:
      operationId: updateBonus
      tags: [bonuses]
      summary: Update a bonus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BonusUpdate"
      responses:
        "200":
          description: Updated bonus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bonus"
    delete:
      operationId: deleteBonus
      tags: [bonuses]
      summary: Delete a bonus
      parameters:
        - in: path
          name: id
          required: true
