  # ─── FAQs ─────────────────────────────────────────────────────────────────────
  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List all FAQs
      parameters:
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"
    post:
      operationId: createFaq
      tags: [faqs]
      summary: Create a FAQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "201":
          description: Created FAQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"

  /faqs/{id}:
    patch:
      operationId: updateFaq
      tags: [faqs]
      summary: Update a FAQ
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqUpdate"
      responses:
        "200":
          description: Updated FAQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
    delete:
      operationId: deleteFaq
      tags: [faqs]
      summary: Delete a FAQ
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── TELEGRAM BUTTONS ─────────────────────────────────────────────────────────
  /telegram-buttons:
    get:
      operationId: listTelegramButtons
      tags: [telegram-buttons]
      summary: List Telegram buttons
      responses:
        "200":
          description: List of buttons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramButton"
    post:
      operationId: createTelegramButton
      tags: [telegram-buttons]
      summary: Create a Telegram button
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramButtonInput"
      responses:
        "201":
          description: Created button
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramButton"

  /telegram-buttons/{id}:
    patch:
      operationId: updateTelegramButton
      tags: [telegram-buttons]
      summary: Update a Telegram button
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramButtonUpdate"
      responses:
        "200":
          description: Updated button
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramButton"
    delete:
      operationId: deleteTelegramButton
      tags: [telegram-buttons]
      summary: Delete a Telegram button
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── SETTINGS ─────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    RejectInput:
      type: object
      properties:
        reason:
          type: string
      required: []

    # ─── DASHBOARD ───────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      properties:
        totalConversations:
          type: number
        activeConversations:
          type: number
        pendingDeposits:
          type: number
        pendingRedeems:
          type: number
        pendingGameAccounts:
          type: number
        pendingFreePlay:
          type: number
        todayDepositsCount:
          type: number
        todayRedeemsCount:
          type: number
        staffHandling:
          type: number
      required: [totalConversations, activeConversations, pendingDeposits, pendingRedeems, pendingGameAccounts, pendingFreePlay, todayDepositsCount, todayRedeemsCount, staffHandling]

    RecentMessage:
      type: object
      properties:
        id:
          type: number
        conversationId:
          type: number
        customerName:
          type: string
        customerTelegramId:
          type: string
        text:
          type: string
        senderType:
          type: string
          enum: [customer, bot, staff]
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, customerName, customerTelegramId, text, senderType, createdAt]

    # ─── CONVERSATIONS ────────────────────────────────────────────────────────────
    Conversation:
      type: object
      properties:
        id:
          type: number
        customerName:
          type: string
        customerTelegramId:
          type: string
        status:
          type: string
          enum: [open, resolved, staff_handling]
        handledBy:
